[package]
name = "pdf-replacer"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "pdf-replacer"
path = "src/main.rs"

[[bin]]
name = "pdf-replacer-advanced"
path = "src/main2.rs"

[[bin]]
name = "pdf-ultimate"
path = "src/main_ultimate.rs"

[[bin]]
name = "pdf-analyzer"
path = "src/main_analyzer.rs"

[[bin]]
name = "pdf-safe"
path = "src/main_safe.rs"

[dependencies]
lopdf = "0.37"
pdf-extract = "0.7"
encoding_rs = "0.8"
regex = "1.10"
clap = { version = "4", features = ["derive"] }
anyhow = "1.0"
rayon = "1.10"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
